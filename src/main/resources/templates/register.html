<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="ISO-8859-1">
</head>
<body>
	<section>
		<div class="container mt-5 p-5">
			<div class="row d-flex justify-content-center">
				<div class="col-md-7 p-2">
					<div class="card p-3 mb-5 bg-body-tertiary rounded">
						<div class="card-header">
							<p class="fs-4">Создать аккаунт</p>
							<th:block th:if="${session.succMsg}">
								<p class="text-success fw-bold">[[${session.succMsg}]]</p>
								<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
							</th:block>

							<th:block th:if="${session.errorMsg}">
								<p class="text-danger fw-bold">[[${session.errorMsg}]]</p>
								<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
							</th:block>
						</div>
						<div class="card-body">
							<form action="/saveUser" enctype="multipart/form-data"
								method="post">
								<div class="row">
									<div class="col">
										<label class="form-label">Имя</label> <input required
											class="form-control" name="name" type="text">
									</div>

									<div class="col">
										<label class="form-label">Телефон</label> <input
											required class="form-control" name="mobileNumber"
											type="number">
									</div>

								</div>

								<div class="mb-3">
									<label class="form-label">Почта</label> <input required
										class="form-control" name="email" type="email">
								</div>


								<div class="row">
									<div class="col">
										<label class="form-label">Адрес</label> <input required
											class="form-control" name="address" type="text">
									</div>

									<div class="col">
										<label class="form-label">Город</label> <input required
											class="form-control" name="city" type="text">
									</div>

								</div>

								<div class="row">
									<div class="col">
										<label class="form-label">Регион</label> <input required
											class="form-control" name="state" type="text">
									</div>

									<div class="col">
										<label class="form-label">Финкод</label> <input required
											class="form-control" name="pincode" type="number">
									</div>

								</div>


								<div class="row">
									<div class="col">
										<label class="form-label">Пароль</label> <input required
											class="form-control" name="password" type="password">
									</div>

									<div class="col">
										<label class="form-label">Подтвердить пароль</label> <input
											required class="form-control" name="cpassword"
											type="password">
									</div>

								</div>



								<div class="mb-3">
									<label class="form-label">Фото профиля</label> <input
										class="form-control" name="img" type="file">
								</div>






								<button type="submit"
									class="btn bg-primary text-white col-md-12 bg-success py-2">Создать</button>
							</form>
						</div>

						<div class="card-footer text-center">
							Есть аккаунт? <a href="/signin" class="text-decoration-none text-danger">Войти
							</a>
						</div>
					</div>
				</div>
			</div>
		</div>

	</section>
</body>
</html>
