<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="ISO-8859-1">
</head>
<body>
	<section>
		<div class=" p-5 mt-4">
		<a href="/admin/" class="text-decoration-none mb-4 d-block"><i
					class="fa-solid fa-arrow-left"></i> Назад</a>
			<div class="row">
				<div class="col-md-3">
					<div class="card">
						<div class="card-header text-center">
							<p class="fs-4  ">Добавить категорию</p>
							<th:block th:if="${session.succMsg}">
								<p class="text-success fw-bold">[[${session.succMsg}]]</p>
								<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
							</th:block>

							<th:block th:if="${session.errorMsg}">
								<p class="text-danger fw-bold">[[${session.errorMsg}]]</p>
								<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
							</th:block>

						</div>
						<div class="card-body">
							<form action="/admin/saveCategory" method="post"
								enctype="multipart/form-data">
								<div class="mb-3">
									<label>Название</label> <input type="text" name="name"
										class="form-control">
								</div>

								<div class="mb-3">
									<label>Статус</label>

									<div class="form-check">
										<input class="form-check-input" type="radio" checked
											value="true" name="isActive" id="flexRadioDefault1">
										<label class="form-check-label" for="flexRadioDefault1">
											Активный </label>
									</div>
									<div class="form-check">
										<input class="form-check-input" type="radio" name="isActive"
											value="false" id="flexRadioDefault2"> <label
											class="form-check-label" for="flexRadioDefault2">
											Пассивный </label>
									</div>

								</div>

								<div class="mb-3">
									<label>Загрузить картинку</label> <input type="file" name="file"
										class="form-control">
								</div>
								<button class="btn btn-success col-md-12 mt-2">Создать</button>
							</form>
						</div>
					</div>
				</div>

				<div class="col-md-9">
					<div class="card">
						<div class="card-header fs-4 py-3">Категории</div>
						<div class="card-body">
							<table class="table">
								<thead>
									<tr>
										<th scope="col">Номер</th>
										<th scope="col">Категория</th>
										<th scope="col">Статус</th>
										<th scope="col">Картинка</th>
										<th scope="col">Действия</th>
									</tr>
								</thead>
								<tbody>
									<tr th:each="cat,c:${categorys}">
										<th scope="row">[[${c.count}]]</th>
										<td>[[${cat.name}]]</td>
										<td>
										    [[${cat.isActive} ? 'Активен' : 'Не активен']]
										</td>
										<td><img
											th:src="@{'/img/category_img/'+${cat.imageName}}"
											width="50px" height="50px"></td>
										<td><a th:href="@{'/admin/loadEditCategory/'+${cat.id}}"
											class="btn btn-primary btn-sm"> Редактировать </a> <a
											th:href="@{'/admin/deleteCategory/'+${cat.id}}"
											class="btn btn-danger btn-sm">Удалить</a></td>
									</tr>

								</tbody>
							</table>

							<div class="row d-flex justify-content-between">
								<div class="col-md-4">Всего категорий:
									[[${totalElements}]]</div>
								<div class="col-md-6 d-flex justify-content-end">

									<nav aria-label="Page navigation example">
										<ul class="pagination">
											<li class="page-item"
												th:classappend="${isFirst} ? 'disabled':''"><a
												class="page-link"
												th:href="@{'/admin/category?pageNo='+${pageNo-1}}"
												aria-label="Previous"> <span aria-hidden="true">&laquo;</span>
											</a></li>

											<li th:each="i:${#numbers.sequence(1,totalPages)}"
												class="page-item"
												th:classappend="${pageNo+1==i}?'active':''" ]]><a
												class="page-link"
												th:href="@{'/admin/category?pageNo='+${i-1}}">[[${i}]]</a></li>

											<li class="page-item"
												th:classappend="${isLast} ? 'disabled':''"><a
												class="page-link"
												th:href="@{'/admin/category?pageNo='+${pageNo+1}}"
												aria-label="Next"> <span aria-hidden="true">&raquo;</span>
											</a></li>
										</ul>
									</nav>
								</div>

							</div>
						</div>
					</div>

				</div>

			</div>
		</div>
	</section>
</body>
</html>
