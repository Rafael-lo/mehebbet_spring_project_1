<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="ISO-8859-1">
</head>
<body>
	<section>
		<div class=" p-5 mt-3">
		<a href="/admin/" class="text-decoration-none mb-4 d-block"><i
					class="fa-solid fa-arrow-left"></i> Назад</a>
			<div class="row">
				<div class="col-md-4 offset-md-4">
					<div class="card ">
						<div class="card-header text-center ">
							<p class="fs-4">Добавить товар</p>

							<th:block th:if="${session.succMsg}">
								<p class="text-success fw-bold">[[${session.succMsg}]]</p>
								<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
							</th:block>

							<th:block th:if="${session.errorMsg}">
								<p class="text-danger fw-bold">[[${session.errorMsg}]]</p>
								<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
							</th:block>

						</div>
						<div class="card-body">
							<form action="/admin/saveProduct" method="post"
								enctype="multipart/form-data">
								<div class="mb-3">
									<label>Название</label> <input type="text" name="title"
										class="form-control">
								</div>

								<div class="mb-3">
									<label>Описание</label>
									<textarea rows="3" cols="" class="form-control"
										name="description"></textarea>
								</div>

								<div class="mb-3">
									<label>Категория</label> <select class="form-control"
										name="category">
										<option>--Выберите--</option>
										<option th:each="c:${categories}">[[${c.name}]]</option>
									</select>
								</div>

								<div class="mb-3">
									<label>Цена</label> <input type="number" name="price"
										class="form-control">
								</div>
								<div class="mb-3">
									<label>Статус</label>

									<div class="form-check">
										<input class="form-check-input" type="radio" checked
											value="true" name="isActive" id="flexRadioDefault1">
										<label class="form-check-label" for="flexRadioDefault1">
											Активный </label>
									</div>
									<div class="form-check">
										<input class="form-check-input" type="radio" name="isActive"
											value="false" id="flexRadioDefault2"> <label
											class="form-check-label" for="flexRadioDefault2">
											Пассивный </label>
									</div>

								</div>
								<div class="row">

									<div class="mb-3 col">
										<label>На складе</label> <input type="text" name="stock"
											class="form-control">
									</div>

									<div class="mb-3 col">
										<label>Загрузить картинку</label> <input type="file" name="file"
											class="form-control">
									</div>
								</div>
								<button class="btn btn-success py-2 col-md-12">Создать</button>
							</form>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
