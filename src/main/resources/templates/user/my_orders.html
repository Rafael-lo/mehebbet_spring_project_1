<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="ISO-8859-1">
</head>
<body>
	<section>
		<div class=" mt-5 p-5">
			<div class="row">
				<p class="fs-3">Мои заказы</p>
				<th:block th:if="${session.succMsg}">
					<p class="text-success fw-bold text-center">[[${session.succMsg}]]</p>
					<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
				</th:block>

				<th:block th:if="${session.errorMsg}">
					<p class="text-danger fw-bold text-center">[[${session.errorMsg}]]</p>
					<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
				</th:block>
				<div class="col-md-12 ">

					<table class="table table-bordered">
						<thead >
							<tr >
								<th scope="col">Номер</th>
								<th scope="col">Дата</th>
								<th scope="col">Данные товара</th>
								<th scope="col">Цена</th>
								<th scope="col">Статус</th>
								<th scope="col">Действия</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="o:${orders}">
								<th scope="row">[[${o.orderId}]]</th>
								<td>[[${o.orderDate}]]</td>
								<td>[[${o.product.title}]]</td>
								<td>Количество: [[${o.quantity}]] <br>Цена:
									[[${o.price}]] <br>Общая стоимость: [[${o.quantity *
									o.price}]]
								</td>
								<td>[[${o.status}]]</td>
								<td>

									<th:block th:if="${o.status!='Cancelled'}">
										<a th:href="@{'/user/update-status?id='+${o.id}+'&st=6' }"
											class="btn btn-sm btn-danger">Отменить</a>
									</th:block>

									<th:block th:unless="${o.status!='Cancelled'}">
										<a href="#" class="btn btn-sm btn-danger disabled" >Отменить</a>
									</th:block>

								</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>

		</div>
	</section>
</body>
</html>
