<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="ISO-8859-1">
</head>
<body>
	<section>
		<div class="bg-warning p-4 mt-5 ">
			<div class="row">
				<div class="col-md-4 ">
					<form action="/products" method="get">
						<div class="input-group">
							<input type="text" class="form-control rounded" placeholder="Что вы хотите найти..."  name="ch">
							<button class="btn btn-light text-dark ms-3 col-md-2 rounded"> Поиск
							</button>
						</div>
					</form>
				</div>
			</div>

		</div>


		<div class="container-fluid mt-1">
			<div class="row">

				<div class="col-md-2 p-0">

					<div class="card shadow-sm p-0 mb-5 ms-2 bg-body-tertiary rounded" style="height: 800px">
						<div class="card-body ">
							<div class="list-group">
								<p class="fs-5">Категории</p>
								<a href="/products"
									th:classappend="${paramValue==''} ? 'active':''"
									class="list-group-item rounded list-group-item-action"
									aria-current="true"> Все </a> <a th:each="c:${categories}"
									th:href="@{'/products?category='+${c.name}}"
									th:classappend="${paramValue == c.name} ? 'bg-danger text-white':''"
									class="list-group-item rounded mt-2 border list-group-item-action">[[${c.name}]]</a>
							</div>
						</div>
					</div>
				</div>
				<div class="col-md-10">
					<div class="card shadow-sm p-3 mb-3 bg-body-tertiary rounded" style="min-height: 800px">
						<div class="card-body">
							<p class="fs-3 ">Товары</p>
							<div class="row">

								<th:block th:if="${productsSize >0}">
									<div class="col-md-3" th:each="p : ${products}">
										<div class="card">
											<div class="card-body ">
												<img alt="" th:src="@{'/img/product_img/'+${p.image}}"
													width="100%" height="240px">
												<p class="fs-5 text-center mt-2">[[${p.title}]]</p>
												<div class="row text-center">
													<p class="fs-6 fw-bold ">
														<span> [[${p.discountPrice}]]</span> <br> <span
															class="text-decoration-line-through text-secondary">
															[[${p.price}]]</span> <span class="fs-6 text-success">[[${p.discount}]]%
															off </span>
													</p>
													<a th:href="@{'/product/'+${p.id}}"
														class="btn btn-primary col-md-6 offset-md-3">Посмотреть детали</a>
												</div>
											</div>
										</div>
									</div>
								</th:block>
								<th:block th:unless="${productsSize>0}">
									<p class="fs-4 text-center mt-4 text-danger h-100 d-flex align-items-center">Товары не найдены</p>
								</th:block>
							</div>

						</div>
					</div>
					<!-- Start Pagination -->
					<div class="row d-flex justify-content-between">
						<h4 class="col-md-4">Всего товаров: [[${totalElements}]]</h4>
						<div class="col-md-6 d-flex justify-content-end">
							<th:block th:if="${productsSize>0}">
								<nav aria-label="Page navigation example">
									<ul class="pagination">
										<li class="page-item"
											th:classappend="${isFirst} ? 'disabled' : '' "><a
											class="page-link"
											th:href="@{'/products?pageNo='+${pageNo-1}}"
											aria-label="Previous"> <span aria-hidden="true">&laquo;</span>
										</a></li>

										<li th:each="i:${#numbers.sequence(1,totalPages)}"
											class="page-item" th:classappend="${pageNo+1==i}?'active':''"
											]]><a class="page-link"
											th:href="@{'/products?pageNo='+${i-1}}">[[${i}]]</a></li>

										<li class="page-item"
											th:classappend="${isLast} ? 'disabled':''"><a
											class="page-link"
											th:href="@{'/products?pageNo='+${pageNo+1}}"
											aria-label="Next"> <span aria-hidden="true">&raquo;</span>
										</a></li>
									</ul>
								</nav>
						</div>
						</th:block>
					</div>

				</div>
			</div>
		</div>

	</section>
</body>
</html>
