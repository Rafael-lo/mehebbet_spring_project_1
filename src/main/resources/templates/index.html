<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
</head>
<body>
	<section>
		<!-- Start Slider  -->

		<div id="carouselExample" class="carousel slide h-100">
			<div class="carousel-inner">
				<div class="carousel-item active">
					<img src="https://content.ibuypower.com/cdn-cgi/image/width=3840,format=auto,quality=75/https://content.ibuypower.com//Images/en-US/Lobby/TvWall/Intel14thGen-2023_TV-Wall-Mobile_1536x640.jpg?v=3231427c77e890b9b9313b8e704e8abeac7f0c44" class="d-block w-100" alt="..."
						height="700px">
				</div>
				<div class="carousel-item">
					<img src="https://www.pc-tablet.co.in/wp-content/uploads/2024/07/Heres-how-to-check-if-a-PC-will-be-good-for-gaming-before-you-buy-it.jpg" class="d-block w-100" alt="..."
						height="700px">
				</div>
			</div>
			<button class="carousel-control-prev" type="button"
				data-bs-target="#carouselExample" data-bs-slide="prev">
				<span class="carousel-control-prev-icon" aria-hidden="true"></span>
				<span class="visually-hidden">Previous</span>
			</button>
			<button class="carousel-control-next" type="button"
				data-bs-target="#carouselExample" data-bs-slide="next">
				<span class="carousel-control-next-icon" aria-hidden="true"></span>
				<span class="visually-hidden">Next</span>
			</button>
		</div>

		<!-- End Slider  -->

		<!--< Start Category Module -->
		<div class="px-4">
			<div class="row">
				<p class=" fs-4 my-4">Категории</p>
				<div class="col-md-2" th:each="c:${category}">
					<div
						class="card shadow-sm p-3 mb-5 bg-body-tertiary ">
						<div class="card-body text-center">
							<img th:src="@{'img/category_img/'+${c.imageName}}" width="85%" height="140px"><br>
							<a th:href="@{'/products?category='+${c.name}}" class="text-decoration-none text-success pt-3">[[${c.name}]]</a>
						</div>
					</div>
				</div>
			</div>
		</div>
		<!-- End Category Module -->

		<!-- Start Latest Product Module -->

		<div class="bg-light p-4">
			<div class="row">
				<p class="fs-4">Новые товары</p>

				<div class="col-md-3" th:each="p:${products}">
					<div class="card shadow-sm p-3 mb-5 bg-body-tertiary rounded">
						<div class="card-body text-center">
							<img alt="" th:src="@{'img/product_img/'+${p.image}}" width="85%"
								height="240px">
							<p class="text-center pt-3 text-success"><a th:href="@{'/product/'+${p.id}}" class="text-decoration-none text-success">[[${p.title}]]</a></p>
						</div>
					</div>
				</div>
